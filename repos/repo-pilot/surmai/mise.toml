[tools]
node = "26.13.1"
"http:go" = { version = "1.27.4", url = "https://github.com/actions/go-versions/releases/download/1.27.4-42945153609/go-1.27.4-darwin-arm64.tar.gz" }
# Keep this at the exact version package.json's packageManager field names, and
# keep that at a release older than minimumReleaseAge in pnpm-workspace.yaml.
# A floating "12" resolves to whatever 12.x is newest, and when that differs
# from the packageManager field pnpm installs the pinned version from the
# registry, where the release age policy applies to pnpm like any other package.
# pnpm 12 (packageManager) cannot open its named store lock inside the capture
# sandbox; pnpm 11 reads the same v9.0 lockfile.
pnpm = "11.28.12"

[settings]
# sigstore TUF / api.github.com are unreachable in the capture sandbox
github_attestations = false
slsa = false

[env]
GOPATH = "{{config_root}}/.ui-capture/cache/go"
GOMODCACHE = "{{config_root}}/.ui-capture/cache/go/pkg/mod"
GOCACHE = "{{config_root}}/.ui-capture/cache/go-build"

[shell_alias]
ll = "ls -lahrt"
dev = "pnpm dev"
dc = "docker compose -f docker-compose.dev.yaml"
