- main:
  - text: Spaces Winter '26 Test Knit
  - heading "Winter '26 Test Knit" [level=1]
  - text: Draft 18 invitees Test window Nov 16 – Dec 14 Settings last changed Sep 3, 2026
  - button "Send 18 invites"
  - text: This space is still a draft. Nobody but you can see it until you send the invites. It started with your community defaults.
  - navigation "Jump to section":
    - button "Who can see it"
    - button "Posting"
    - button "Photo protection"
