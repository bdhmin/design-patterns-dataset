  - 'button "SGLT1: why 2 Na+?"'
- paragraph: why does SGLT1 need two sodium ions per glucose and not one?
- paragraph:
  - text: Energy budget. Glucose in the enterocyte can be much more concentrated than in the lumen, so moving it in is uphill. Each Na+ moving in releases free energy (concentration gradient
  - strong: plus
  - text: the negative membrane potential).
- paragraph:
  - text: One Na+ only provides enough to concentrate glucose ~100-fold;
  - strong: two
  - text: Na+ square that, allowing ~10 000-fold accumulation. That lets the gut absorb glucose almost completely even when lumen levels are low.
- paragraph: The notes don't derive this, so it's a good one to confirm in office hours as you planned.
