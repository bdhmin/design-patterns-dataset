codebookVersion: 1.0.0
name: Inline entity chip
level: component
parent: consume-media
definition: Small, colour-coded pill markers placed inline in a reading surface next to a detected
  concept. Clicking one opens a related rich view (a 3D model, formula, graph, animation or source)
  in an adjacent panel. The chips are generated by the system rather than written as discussion by
  people.
