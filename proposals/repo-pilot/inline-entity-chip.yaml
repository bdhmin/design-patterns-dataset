    family: initiative
    question: Who creates the chip?
    subdimensions:
      - id: origin
        name: Origin
        select: one
        values:
          - id: system-detected
            name: System detected
          - id: author-inserted
            name: Author inserted
  - name: Activation target
    family: flow
    question: What opens on click?
    subdimensions:
      - id: target
        name: Target
        select: one
        values:
          - id: side-panel-view
            name: Side panel view
          - id: hover-card
            name: Hover card
          - id: navigate-away
            name: Navigate away
rationale:
  - rater: rater-3
    site: get-it--document-chat
    text: Annotation assumes a discussion anchored to a region of the artifact. Inline-suggestion
      assumes proposed edits. Badge assumes a count or status shown on a host element. None of them
      covers a system-detected, typed entity marker in running text that opens a linked rich view.
