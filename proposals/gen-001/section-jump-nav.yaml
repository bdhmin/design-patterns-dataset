    family: layout
    question: How are the jump targets drawn?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: chip-row
            name: Chip row
          - id: side-toc
            name: Side table of contents
          - id: underline-links
            name: Underlined link row
      - id: status
        name: Per-section status
        select: many
        values:
          - id: none
            name: None
          - id: scrollspy-active
            name: Active section highlighted on scroll
          - id: change-dot
            name: Changed/error dot per section
rationale:
  - rater: rater-3
    site: paid-maker-community-settings
    text: Tabs hide non-selected panels; breadcrumbs show hierarchy. Nothing covers in-page anchor
      navigation over a sectioned settings/doc page.
