codebookVersion: 1.0.0
name: Section jump navigation
level: component
parent: navigate
definition: A row or list of links/chips that scroll a long page to its named sections, sometimes
  sticky and marked with per-section status. Unlike tabs, all sections stay rendered on one
  scrolling page.
aliases:
  - jump links
  - on this page
  - anchor nav
  - scrollspy
